name = "markdown-editor"
main = "worker.js"
compatibility_date = "2026-01-20"
workers_dev = true
preview_urls = true


# auto generated from cloudflare dashboard
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[[routes]]
pattern = "admin.seemsgood.org"
custom_domain = true

# R2 Bucket binding
[[r2_buckets]]
binding = "MARKDOWN_BUCKET"
bucket_name = "markdown-files"
